<style>
:root{--bg:#0e0b16;--surface:#171226;--text:#ece8f5;--muted:#a89fc4;--primary:#c9a24b;--border:#2a2340}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.65;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:32px 20px 64px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
header.top .brand{font-weight:800;letter-spacing:.14em;color:var(--primary);font-size:20px}
a{color:var(--primary)}
h1{font-size:26px;margin:24px 0 8px;line-height:1.25}
p{margin:0 0 14px}
p.lead{color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:12px;margin:28px 0 8px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 20px;border-radius:14px;font-size:17px;font-weight:700;text-decoration:none;text-align:center}
.btn-primary{background:var(--primary);color:#171226}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.note{color:var(--muted);font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.nav{margin-top:8px;font-size:14px}.nav a{margin-right:16px}
footer{margin-top:48px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:18px}
footer a{margin-right:14px}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><span class="brand">NOTT</span></header>
<h1>NOTT</h1>
<p class="lead">Donde ves los planes de tus amigos por la noche: dónde van, quién se apunta y cómo acabó la cosa.</p>
<div class="actions">
<a class="btn btn-primary" id="open" href="nox://feed">Abrir en NOTT</a>
<a class="btn btn-secondary" href="https://apps.apple.com/es/app/id6797049428">Descargar en la App Store</a>
</div>
<footer>
<a href="/privacidad/">Privacidad</a><a href="/terminos/">Términos</a><a href="/soporte/">Soporte</a>
<p>© NOTT · nott.es</p>
</footer>
</div>
<script>
// spec 068: el esquema sigue siendo nox:// a propósito. Las versiones 1.0.0/1.1.0 solo entienden
// ese; la 1.2.0 (NOTT) entiende nox:// y nott://. Cambiarlo dejaría fuera a los que no han actualizado.
(function(){
  // Si NOTT está instalada, iOS pregunta "¿Abrir en NOTT?" y la abre con el nox://. Aquí
  // SOLO se intenta abrir la app: la App Store automática se quitó (QA 2026-09-14) porque
  // con el aviso de iOS en pantalla la página sigue visible y el temporizador mandaba a la
  // App Store aunque la app se abriera. El botón "Descargar en la App Store" ya lleva allí.
  // Con los universal links (build 20) iOS abrirá la app antes de cargar esta página.
  function autoOpen(target){
    if(!/iPhone|iPad|iPod/i.test(navigator.userAgent)){return;}
    setTimeout(function(){window.location.href=target;},60);
  }
  autoOpen('nox://feed');
})();
</script>
</body>
</html>
