<title>Pantalla de reserva · Noche NOTT en Luminata</title>
<!--
  Spec 103 · Pantalla de RESERVA del proyector (plan B). Funciona SIN INTERNET: todo va dentro de
  este fichero (sin fuentes, scripts ni imágenes de fuera; el QR es un SVG en línea). Si la
  pantalla en directo (lista.nott.es/pantalla) fallara, se abre esta y se pone a pantalla
  completa (en Chrome, ⌃⌘F). El QR lleva a https://nott.es/noche/e86de191-0f56-4b4f-b210-bf66e5d505a4.
  Guárdala también en el portátil del local (Archivo → Guardar como) para abrirla sin red.
-->
<style>
:root{--bg:#0e0b16;--surface:#171226;--text:#ece8f5;--fg2:#d6d0e6;--muted:#a89fc4;--gold:#c9a24b;--on-gold:#171226;--line:#2a2340;--u:1vmin}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;cursor:none}
.root{height:100%;display:flex;flex-direction:column;padding:calc(2.2*var(--u));gap:calc(1.8*var(--u))}
header{display:flex;align-items:center;gap:calc(1.8*var(--u));height:calc(8*var(--u));flex-shrink:0}
.brand{font-weight:800;letter-spacing:.06em;color:var(--gold);font-size:calc(5*var(--u));line-height:1}
.sep{width:1px;height:calc(4*var(--u));background:var(--line)}
.title{color:var(--fg2);font-size:calc(3.4*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(5*var(--u));padding:calc(4*var(--u));border:1px solid var(--line);border-radius:calc(2.5*var(--u));background:var(--surface)}
.copy{flex:1;min-width:0}
h1{font-size:calc(6.4*var(--u));line-height:1.04;font-weight:800;margin-bottom:calc(3.5*var(--u))}
ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:calc(2.2*var(--u))}
li{display:flex;align-items:center;gap:calc(2*var(--u));font-size:calc(3.8*var(--u));color:var(--fg2);line-height:1.2}
li strong{color:var(--text);font-weight:600}
.n{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:calc(6.5*var(--u));height:calc(6.5*var(--u));border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:calc(3.6*var(--u))}
.qr{flex-shrink:0;width:min(calc(34*var(--u)),62vh);background:#fff;padding:calc(1.6*var(--u));border-radius:calc(2*var(--u));box-shadow:0 0 0 calc(.6*var(--u)) var(--gold);animation:glow 3s ease-in-out infinite}
.qr svg{display:block;width:100%;height:auto}
.url{margin-top:calc(1.4*var(--u));text-align:center;color:var(--muted);font-size:calc(2*var(--u))}
@keyframes glow{50%{box-shadow:0 0 0 calc(.6*var(--u)) var(--gold),0 0 calc(5*var(--u)) rgba(201,162,75,.45)}}
@media (orientation:portrait){.stage{flex-direction:column}.copy{flex:none}.qr{width:min(calc(50*var(--u)),40vh)}}
@media (prefers-reduced-motion:reduce){.qr{animation:none}}
</style>
