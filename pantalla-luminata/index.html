<title>Pantalla de reserva · Noche NOTT en Luminata</title>
<!--
  Spec 103 · Pantalla de RESERVA del proyector (plan B). Funciona SIN INTERNET: todo va dentro de
  este fichero (sin fuentes, scripts ni imágenes de fuera; el QR es un SVG en línea y el pomerania, un WebP en línea). Si la
  pantalla en directo (lista.nott.es/pantalla) fallara, se abre esta y se pone a pantalla
  completa (en Chrome, ⌃⌘F). El QR lleva a https://nott.es/noche/e86de191-0f56-4b4f-b210-bf66e5d505a4.
  Guárdala también en el portátil del local (Archivo → Guardar como) para abrirla sin red.
  Formato (tecla B, como la pantalla en directo): la LED de Luminata es una banda 4:1 y el portátil
  saca 16:9. Pantalla entera → banda 4:1 arriba → centrada → estirada (si el procesador aplasta la
  imagen entera). Se recuerda en este navegador. También vale ?f=arriba|centro|estirada en la URL.
-->
<style>
:root{--bg:#0e0b16;--surface:#171226;--text:#ece8f5;--fg2:#d6d0e6;--muted:#a89fc4;--gold:#c9a24b;--on-gold:#171226;--line:#2a2340;--u:1cqmin}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;cursor:none}
.frame{position:absolute;left:0;top:0;width:100%;height:100%;container-type:size;background:var(--bg);overflow:hidden;transform-origin:top left}
.root{height:100%;display:flex;flex-direction:column;padding:calc(2.2*var(--u));gap:calc(1.8*var(--u))}
header{display:flex;align-items:center;gap:calc(1.8*var(--u));height:calc(8*var(--u));flex-shrink:0}
.mark{height:calc(6.4*var(--u));width:auto;margin-right:calc(-.6*var(--u))}
.brand{font-weight:800;letter-spacing:.06em;color:var(--gold);font-size:calc(5*var(--u));line-height:1}
.sep{width:1px;height:calc(4*var(--u));background:var(--line)}
.title{color:var(--fg2);font-size:calc(3.4*var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:calc(5*var(--u));padding:calc(4*var(--u));border:1px solid var(--line);border-radius:calc(2.5*var(--u));background:var(--surface)}
.copy{flex:1;min-width:0}
h1{font-size:calc(6.4*var(--u));line-height:1.04;font-weight:800;margin-bottom:calc(3.5*var(--u))}
ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:calc(2.2*var(--u))}
li{display:flex;align-items:center;gap:calc(2*var(--u));font-size:calc(3.8*var(--u));color:var(--fg2);line-height:1.2}
li strong{color:var(--text);font-weight:600}
.n{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:calc(6.5*var(--u));height:calc(6.5*var(--u));border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:calc(3.6*var(--u))}
.qr{flex-shrink:0;width:min(calc(34*var(--u)),62cqh);background:#fff;padding:calc(1.6*var(--u));border-radius:calc(2*var(--u));box-shadow:0 0 0 calc(.6*var(--u)) var(--gold);animation:glow 3s ease-in-out infinite}
.qr svg{display:block;width:100%;height:auto}
.url{margin-top:calc(1.4*var(--u));text-align:center;color:var(--muted);font-size:calc(2*var(--u))}
@keyframes glow{50%{box-shadow:0 0 0 calc(.6*var(--u)) var(--gold),0 0 calc(5*var(--u)) rgba(201,162,75,.45)}}
@container (orientation:portrait){.stage{flex-direction:column}.copy{flex:none}.qr{width:min(calc(50*var(--u)),40cqh)}}
/* En banda (2,4:1 o más ancha), las medidas salen del alto: 1 % del alto dejaba la letra diminuta. */
@container (min-aspect-ratio:12/5){header{height:11cqh}.mark{height:9cqh}.brand{font-size:7cqh}.sep{height:6cqh}.title{font-size:5.5cqh}.stage{padding:4cqh 4cqh 4cqh 5cqh;gap:4cqw}h1{font-size:min(13cqh,4.6cqw);margin-bottom:5cqh}ol{gap:3.5cqh}li{font-size:min(8cqh,3cqw);gap:2.5cqh}.n{width:10cqh;height:10cqh;font-size:5.5cqh}.qr{width:min(72cqh,30cqw);padding:2cqh}.url{display:none}}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:.6em 1.4em;border-radius:999px;background:rgba(14,11,22,.92);border:1px solid var(--gold);color:var(--gold);font:700 28px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.qr{animation:none}}
</style>

<p class="toast" id="toast" role="status"></p>
<script>
(function(){
  var MODES=['entera','arriba','centro','estirada'];
  var LABEL={entera:'Pantalla entera',arriba:'Banda 4:1 arriba',centro:'Banda 4:1 centrada',estirada:'Banda 4:1 estirada'};
  var KEY='nott.reserva.formato';
  var frame=document.getElementById('frame'),toast=document.getElementById('toast'),t;
  var mode='entera';
  var q=(location.search.match(/[?&]f=([a-z]+)/)||[])[1];
  try{mode=localStorage.getItem(KEY)||mode}catch(e){}
  if(MODES.indexOf(q)>=0)mode=q;
  if(MODES.indexOf(mode)<0)mode='entera';
  function place(){
    var W=innerWidth,H=innerHeight,w=W,h=H,top=0,left=0,sy=1;
    if(mode!=='entera'&&W>0&&H>0){
      if(W/H>=4){w=H*4;left=(W-w)/2}
      else{h=W/4;if(mode==='centro')top=(H-h)/2;if(mode==='estirada')sy=H/h}
    }
    frame.style.width=w+'px';frame.style.height=h+'px';frame.style.left=left+'px';frame.style.top=top+'px';
    frame.style.transform=sy===1?'':'scaleY('+sy+')';
  }
  function say(text){toast.textContent=text;toast.className='toast on';clearTimeout(t);t=setTimeout(function(){toast.className='toast'},1500)}
  addEventListener('resize',place);
  addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='b'||e.key==='B'){
      mode=MODES[(MODES.indexOf(mode)+1)%MODES.length];
      try{localStorage.setItem(KEY,mode)}catch(err){}
      place();say(LABEL[mode]+' · tecla B');
    }
  });
  place();
})();
</script>
